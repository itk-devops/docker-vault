networks:
  frontend:
    external: true
  app:
    driver: bridge
    internal: false

services:
  nginx:
    image: nginx/nginx-unprivileged:alpine
    networks:
      - app
      - frontend
    depends_on:
      - vault
    ports:
      - '8080'
    volumes:
      - ./.docker/templates:/etc/nginx/templates:ro
      - .:/app
    environment:
      NGINX_WEB_ROOT: /app/web
      NGINX_PORT: 8080
      NGINX_MAX_BODY_SIZE: 5M
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}.rule=Host(`${COMPOSE_DOMAIN:?}`)"
      # HTTPS config - enable redirect from :80 to :443
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:?}.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  vault:
    image: hashicorp/vault:${VAULT_VERSION:-v2.2.1}
    ports:
      - "8200" # API
      - "8201" # UI
    restart: always
    networks:
      - app
    volumes:
      - .docker/data/logs:/vault/logs/:rw
      - .docker/data/data:/vault/data/:rw
      - .docker/data/config:/vault/config/:rw
      - .docker/data/file:/vault/file/:rw
    pre_start:
      - user: root
        entrypoint: sh
        command: -c 'chown -R 100:1000 /vault/logs /vault/data /vault/config /vault/file'
    cap_add:
      - IPC_LOCK
    entrypoint: vault server -config /vault/config/config.hcl